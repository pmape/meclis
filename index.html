<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meclis</title>
<meta name="description" content="Birçok yapay zekaya aynı soruyu sorup cevapları karşılaştıran çalışma aracı.">
<meta name="theme-color" content="#1D4ED8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="simge.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/stil.css">
</head>
<body>
<div class="duzen">

  <!-- SOL MENÜ -->
  <nav class="menu" aria-label="Ana menü">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="19" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="21" cy="19" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Meclis</span>
    </div>

    <button type="button" class="dugme dugme-cerceve dugme-genis" id="yeniSohbet">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Yeni sohbet
    </button>

    <div class="menu-grup">
      <button type="button" class="menu-oge" data-gorunum="durum">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 14V9M8 14V5M13 14V2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Yapay zeka durumu
      </button>
      <button type="button" class="menu-oge" data-gorunum="ayarlar">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 1.5v2.5M9 14v2.5M1.5 9H4M14 9h2.5M3.7 3.7l1.8 1.8M12.5 12.5l1.8 1.8M3.7 14.3l1.8-1.8M12.5 5.5l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Ayarlar
      </button>
    </div>

    <div class="menu-grup">
      <span class="menu-baslik">Projeler</span>
      <p class="menu-not">2. aşamada gelecek.</p>
    </div>

    <div class="menu-grup menu-gecmis">
      <span class="menu-baslik">Son sohbetler</span>
      <div id="gecmisListe"></div>
    </div>

    <div class="menu-alt">
      <div class="esitleme" id="depoDurum">Klasör seçilmedi</div>
      <button type="button" class="dugme dugme-sade" id="temaDegistir" aria-label="Koyu ve açık tema arasında geçiş yap">Tema</button>
    </div>
  </nav>

  <!-- ORTA -->
  <main class="orta" id="orta">
    <header class="ust">
      <div>
        <span class="ust-alt" id="ustAlt">Sohbet</span>
        <h1 id="ustBaslik">Yeni sohbet</h1>
      </div>
      <div class="ust-sag">
        <span class="hap" id="katilimciSayisi">0 katılımcı</span>
      </div>
    </header>

    <section class="gorunum" id="gorunumSohbet">
      <div class="akis" id="akis" aria-live="polite"></div>

      <div class="yazma">
        <form class="yazma-kutu" id="soruFormu">
          <label for="soru" class="yazma-etiket">Meclis'e sor</label>
          <textarea id="soru" rows="2" placeholder="Sorunu ya da fikrini yaz..."></textarea>
          <div class="yazma-alt">
            <div class="yazma-secenekler">
              <span class="hap hap-mavi" id="secimBilgisi" hidden></span>
              <button type="button" class="hap hap-dugme" id="secimiKaldir" hidden>Seçimi kaldır</button>
            </div>
            <button type="submit" class="gonder" id="gonder" aria-label="Gönder">
              <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="gorunum" id="gorunumAyarlar" hidden></section>
    <section class="gorunum" id="gorunumDurum" hidden></section>
  </main>

  <!-- SAĞ PANEL -->
  <aside class="panel" aria-label="Durum paneli">
    <section>
      <h2>Yapay zeka durumu</h2>
      <div id="panelDurum" class="durum-liste"></div>
    </section>
    <section class="kart">
      <h2>Proje paneli</h2>
      <p class="soluk">Hafıza, yol haritası, çalışması gerekenler listesi ve önizleme 2. aşamada buraya gelecek.</p>
    </section>
  </aside>
</div>

<!-- Kurulum sihirbazı ve şifre penceresi buraya çizilir -->
<div id="pencere" class="pencere-arka" hidden></div>

<div id="bildirim" class="bildirim" role="status" hidden></div>

<script type="module" src="js/uygulama.js"></script>
</body>
</html>
